{% extends "auth/base.html" %}

{% block title %}Login - LLM Aggregator{% endblock %}

{% block content %}
<div class="text-center">
    <h2 style="color: #333; margin-bottom: 2rem;">Login</h2>
</div>

<form method="POST">
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit" class="btn">Login</button>

    <div class="text-center mt-3">
        <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
    </div>

    <div class="text-center mt-2">
        <a href="{{ url_for('home') }}" class="link-muted">Back to welcome page</a>
        &nbsp;·&nbsp;
        <a href="#" class="link-muted" onclick="continueAsGuest(event)">Continue as guest</a>
    </div>
</form>

<script>
    async function continueAsGuest(e) {
        e.preventDefault();
        const res = await fetch('/api/auth/guest', { method: 'POST' });
        if (res.ok) { window.location.href = '/'; }
    }
</script>
{% endblock %}
