runtime: python312

# --timeout 300: gunicorn's sync worker has a default 30s timeout, which would kill
# the worker while a request like peer review/text-to-image -- which can run to a
# minute or two -- still hasn't finished, losing the whole response (showing up as
# blind review intermittently not displaying at all). 300s covers image generation's
# AnyProvider worst-case outer timeout (145s) plus the typical time spent queuing
# multiple providers' peer review. This is deployment-layer config, independent from
# the business-side image/peer-review timeout formulas; changing those doesn't
# require changing this, but if both sides grow, confirm this value is still enough.
entrypoint: gunicorn -b :$PORT --timeout 300 main:app

env_variables:
  FLASK_ENV: production
  SECRET_KEY: "${SECRET_KEY}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
  GEMINI_API_KEY: "${GEMINI_API_KEY}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6

handlers:
- url: /static
  static_dir: static

- url: /.*
  script: auto
