runtime: python312

entrypoint: gunicorn -b :$PORT main:app

env_variables:
  FLASK_ENV: production
  SECRET_KEY: "${SECRET_KEY}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
  GEMINI_API_KEY: "${GEMINI_API_KEY}"

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6

handlers:
- url: /static
  static_dir: static

- url: /.*
  script: auto
