runtime: python312

# --timeout 300: gunicorn 的 sync worker 默认 30s 超时会在互评/文生图这类可能跑到
# 一两分钟以上的请求还没跑完时就把 worker 杀掉，响应因此整个丢失（表现为 blind
# review 概率性完全不显示）。300s 覆盖了图片生成 AnyProvider 的最坏 outer 超时
# (145s) 和多 provider 互评排队的常见耗时。这是部署层配置，跟业务侧的图片/互评
# 超时公式互相独立，改那边不需要跟着改这里，但如果两边都涨了要确认这个值还够用。
entrypoint: gunicorn -b :$PORT --timeout 300 main:app

env_variables:
  FLASK_ENV: production
  SECRET_KEY: "${SECRET_KEY}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
  GEMINI_API_KEY: "${GEMINI_API_KEY}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6

handlers:
- url: /static
  static_dir: static

- url: /.*
  script: auto
